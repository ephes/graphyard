[workspace]
resolver = "3"
members = [
    "crates/graphyard-core",
    "crates/graphyard-store",
    "crates/graphyard-influx",
    "crates/graphyard-collect",
    "crates/graphyard-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ephes/graphyard"
publish = false

# Shared dependency versions (PLAN.md 4.3). Slices add the crates they need
# here and refer to them with `workspace = true` from their crate manifests.
[workspace.dependencies]
graphyard-core = { path = "crates/graphyard-core" }
graphyard-store = { path = "crates/graphyard-store" }
graphyard-influx = { path = "crates/graphyard-influx" }
graphyard-collect = { path = "crates/graphyard-collect" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
# User regexes of spec configs (PLAN.md 4.3, D-5): Python `re` features such
# as lookaround and backreferences.
fancy-regex = "0.19"
indexmap = "2"
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
percent-encoding = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# HTTP client (PLAN.md 4.3): rustls with ring and the system trust store
# (rustls-platform-verifier, D-12), no OpenSSL, no aws-lc; HTTP/1.1 only;
# gzip/deflate response decoding for the queries.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
tempfile = "3"
tokio = "1"
# HTTP layer of the collectors (graphyard-collect, PLAN.md 4.3, 6.1):
# hyper's HTTP/1.1 client connection API over tokio sockets with httpx's
# per-read timeouts, rustls (ring) with the system trust store, httpx's
# decoders on flate2, a cookie jar per client.
base64 = "0.22"
cookie_store = { version = "0.22", default-features = false, features = ["preserve_order"] }
dns-lookup = "3"
flate2 = "1"
idna = "1"
rustls-native-certs = "0.8"
url = "2"
# Shared by the HTTP layer and the fake servers of the tests.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
influxdb-line-protocol = "2"
rcgen = "0.14"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
