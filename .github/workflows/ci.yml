name: CI

# Same checks as `just lint`, `just typecheck` and `just test`: the Python
# parts (incl. the Rust fixture drift test) in the `python` job, the Rust
# agent in agent-rs/ in the `rust` job, and `just rs-parity` (the Python and
# Rust agents on the same corpus and fake servers) in the `parity` job.
# Lint runs the pre-commit Ruff hooks (check and format) exactly as locally.
# Tests use config.settings.test (SQLite, InfluxDB mocked), so no secrets or
# external services are needed. The opt-in inventory probes are not run here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON: "3.12"

jobs:
  python:
    name: Lint, typecheck and tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync
      - name: Lint (just lint)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Typecheck (just typecheck)
        run: |
          uv run mypy
          uv run mypy --check-untyped-defs scripts/inventory_transport_probe.py scripts/inventory_sender_probe.py
      - name: Tests (just test)
        run: uv run pytest -q

  rust:
    name: Rust agent (fmt, clippy, deny, tests, release build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-rs
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (agent-rs/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            agent-rs/target
          key: rust-${{ runner.os }}-${{ hashFiles('agent-rs/rust-toolchain.toml', 'agent-rs/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Format (cargo fmt)
        run: cargo fmt --all --check
      - name: Lint (cargo clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-deny (pinned release, sha256 checked)
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/${name}.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/${name}.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: Supply chain (cargo deny, agent-rs/deny.toml)
        run: cargo deny --locked check
      - name: Tests (cargo test)
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Binary size
        run: |
          size=$(stat -c %s target/release/graphyard-agent)
          echo "graphyard-agent release binary: ${size} bytes"
          echo "graphyard-agent release binary: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

  parity:
    name: Rust agent parity harness (just rs-parity)
    needs: [python, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync
      - name: Install the pinned toolchain (agent-rs/rust-toolchain.toml)
        working-directory: agent-rs
        run: |
          rustup toolchain install
          rustc --version
          openssl version
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            agent-rs/target
          key: rust-parity-${{ runner.os }}-${{ hashFiles('agent-rs/rust-toolchain.toml', 'agent-rs/Cargo.lock') }}
          restore-keys: rust-parity-${{ runner.os }}-
      - name: Build the agent
        working-directory: agent-rs
        run: cargo build --locked
      - name: Parity harness
        run: uv run python agent-rs/parity/run_parity.py --rust-binary agent-rs/target/debug/graphyard-agent
